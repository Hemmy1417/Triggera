name: tests

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest genvm-linter
      - name: Direct suite
        run: python -m pytest tests/direct -q
      # AST lint only. The contract targets the GenVM v0.6 runner that Studio
      # Next ships (py-genlayer:5jycge4q...), and genvm-lint's `check` can only
      # load the SDK of the GenVM releases it knows (v0.3.0-rc7), so semantic
      # validation of this runner happens where it can: on the deployment
      # itself, byte-verified in docs/DEPLOYMENT.md.
      - name: genvm-lint (AST)
        run: PYTHONUTF8=1 genvm-lint lint contracts/verda.py --json
      - name: Mutation sweep gate
        run: |
          python - << 'PYEOF'
          import pathlib
          src = pathlib.Path("tests/mutation_sweep.py").read_text(encoding="utf-8")
          src = src.replace('SRC = pathlib.Path(r"C:/Users/Pc/Desktop/Verda")',
                            'SRC = pathlib.Path(".").resolve()')
          pathlib.Path("/tmp/mutate.py").write_text(src, encoding="utf-8")
          PYEOF
          python /tmp/mutate.py | tee sweep.out
          grep -q "survived 0" sweep.out
          grep -q "anchor-missing 0" sweep.out
          ! grep -q "CONTROL \*\*FAILED\*\*" sweep.out

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (the exact check Vercel runs)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          # The deployment of record. docs/DEPLOYMENT.md and web/.env.example
          # name the same address (S37); `npm run verify` checks all three.
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x397bd60cF62755C281a9a24C6398a316F7814a5e"
